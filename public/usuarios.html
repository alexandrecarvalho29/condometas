<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Condometas - Usuários</title>
  <link rel="stylesheet" href="usuarios.css">
  <style>
    .reset-password-btn { 
      margin-top: 10px; 
      background: #e05414; 
      color: white; 
      padding: 0.5rem 1rem; 
      border: none; 
      border-radius: 0.5rem; 
      cursor: pointer;
    }
  </style>
</head>
<body>
<header class="header">
  <div class="left-group">
    <div class="titulo">Condometas</div>
    <button id="menuButton">
      <div class="hamburguer">
        <span></span><span></span><span></span>
      </div>
      <span class="menu-text">MENU</span>
    </button>      
  </div>

  <div id="dropdownMenu">
    <a href="metas.html">Metas</a>
    <a href="usuarios.html">Usuários</a>
    <a href="relatorio.html">Relatórios</a>
  </div>
</header>

<main class="container">
  <h1>Usuários</h1>

  <button id="btnNewUser" class="edit-user-btn" style="margin-bottom: 15px;">Novo Usuário</button>
  <button id="btnAbrirRedefinirSenha" class="edit-user-btn" style="margin-bottom: 15px;">Redefinir Minha Senha</button>

  <section class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>Ações</th>
          <th>ID</th>
          <th>Login</th>
          <th>Nome</th>
          <th>Email</th>
          <th>Cargo</th>
          <th>Data Criação</th>
        </tr>
      </thead>
      <tbody id="usuariosTable"></tbody>
    </table>
  </section>

  <!-- Modal de Edição -->
  <div id="editUserModal" class="modal">
    <div class="modal-content">
      <span class="close-btn">&times;</span>
      <h2>Editar Usuário</h2>
      <form id="editUserForm">
        <input type="hidden" id="editUserId" name="editUserId">
        <div class="form-group">
          <label>Login</label>
          <input type="text" id="editUserLogin" name="editUserLogin" readonly style="background: #f0f0f0;">
        </div>
        <div class="form-group">
          <label>Nome</label>
          <input type="text" id="editUserName" name="editUserName">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="editUserEmail" name="editUserEmail">
        </div>
        <div class="form-group">
          <label>Cargo</label>
          <select id="editUserCargo" name="editUserCargo">
            <option value="admin">Admin</option>
            <option value="gerente">Gerente</option>
            <option value="coordenador">Coordenador</option>
            <option value="analista">Analista</option>
          </select>
        </div>
        <div class="form-group">
          <label>Data Criação</label>
          <input type="date" id="editUserDataCriacao" name="editUserDataCriacao" readonly style="background: #f0f0f0;">
        </div>
        <button type="button" id="btnRedefinirSenhaPadrao" class="reset-password-btn">Redefinir senha para padrão</button>
        <button type="submit">Salvar Alterações</button>
      </form>
    </div>
  </div>

  <!-- Modal de Novo Usuário -->
  <div id="newUserModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" id="closeNewUserModal">&times;</span>
      <h2>Novo Usuário</h2>
      <form id="newUserForm">
        <div class="form-group">
          <label>Login</label>
          <input type="text" id="newUserLogin" name="newUserLogin" required>
        </div>
        <div class="form-group">
          <label>Nome</label>
          <input type="text" id="newUserName" name="newUserName" required>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="newUserEmail" name="newUserEmail" required>
        </div>
        <div class="form-group">
          <label>Cargo</label>
          <select id="newUserCargo" name="newUserCargo" required>
            <option value="admin">Admin</option>
            <option value="gerente">Gerente</option>
            <option value="coordenador">Coordenador</option>
            <option value="analista">Analista</option>
          </select>
        </div>
        <button type="submit">Criar Usuário</button>
      </form>
    </div>
  </div>

  <!-- Modal para redefinir própria senha -->
  <div id="redefinirSenhaModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" id="closeRedefinirSenha">&times;</span>
      <h2>Redefinir Minha Senha</h2>
      <form id="redefinirSenhaForm">
        <div class="form-group">
          <label>Nova Senha</label>
          <input type="password" id="novaSenhaUsuario" name="novaSenhaUsuario" required>
        </div>
        <button type="button" id="btnRedefinirMinhaSenha" class="reset-password-btn">Redefinir Minha Senha</button>
      </form>
    </div>
  </div>

</main>

<script>
const token = localStorage.getItem('token');
const usuarioLogado = JSON.parse(localStorage.getItem('usuario'));
let usuarios = [];

// Carregar usuários
async function carregarUsuarios() {
  try {
    const res = await fetch('/api/usuarios', { headers: { 'Authorization': `Bearer ${token}` } });
    usuarios = res.ok ? await res.json() : [];
    renderizarUsuarios();
  } catch (err) { console.error(err); }
}

// -------- MENU DROPDOWN -------- //

  const menuButton = document.getElementById('menuButton');
  const dropdownMenu = document.getElementById('dropdownMenu');

  // Alterna visibilidade do menu
  menuButton.addEventListener('click', (e) => {
    e.stopPropagation(); // evita fechar imediatamente
    dropdownMenu.style.display = dropdownMenu.style.display === 'block' ? 'none' : 'block';
  });

  // Fecha o menu ao clicar fora
  document.addEventListener('click', () => {
    dropdownMenu.style.display = 'none';
  });

function renderizarUsuarios() {
  const tabela = document.getElementById('usuariosTable');
  tabela.innerHTML = usuarios.map(u => `
    <tr>
      <td><button class="edit-user-btn" data-id="${u.id}">Editar</button></td>
      <td>${u.id}</td>
      <td>${u.login}</td>
      <td>${u.nome}</td>
      <td>${u.email}</td>
      <td>${u.cargo}</td>
      <td>${u.data_criacao}</td>
    </tr>
  `).join('');
}

// Modal de edição
const editUserModal = document.getElementById('editUserModal');
const editUserForm = document.getElementById('editUserForm');
const closeBtn = editUserModal.querySelector('.close-btn');
const btnRedefinirSenhaPadrao = document.getElementById('btnRedefinirSenhaPadrao');

// Modal de novo usuário
const newUserModal = document.getElementById('newUserModal');
const btnNewUser = document.getElementById('btnNewUser');
const closeNewUserModal = document.getElementById('closeNewUserModal');
const newUserForm = document.getElementById('newUserForm');

// Modal redefinir própria senha
const btnAbrirRedefinirSenha = document.getElementById('btnAbrirRedefinirSenha');
const redefinirSenhaModal = document.getElementById('redefinirSenhaModal');
const closeRedefinirSenha = document.getElementById('closeRedefinirSenha');
const btnRedefinirMinhaSenha = document.getElementById('btnRedefinirMinhaSenha');
const inputNovaSenha = document.getElementById('novaSenhaUsuario');

// Mostrar botão de redefinir padrão apenas para coordenador
btnRedefinirSenhaPadrao.style.display = usuarioLogado?.cargo === 'coordenador' ? 'block' : 'none';

// Abrir modal de edição
document.addEventListener('click', e => {
  if (e.target.classList.contains('edit-user-btn')) {
    const id = e.target.dataset.id;
    const user = usuarios.find(u => u.id == id);

    editUserForm.editUserId.value = user.id;
    editUserForm.editUserLogin.value = user.login;
    editUserForm.editUserName.value = user.nome;
    editUserForm.editUserEmail.value = user.email;
    editUserForm.editUserCargo.value = user.cargo;
    editUserForm.editUserDataCriacao.value = user.data_criacao || '';

    editUserModal.style.display = 'block';
  }
});

// Salvar alterações
editUserForm.addEventListener('submit', async e => {
  e.preventDefault();
  const id = editUserForm.editUserId.value;
  const index = usuarios.findIndex(u => u.id == id);
  if (index > -1) {
    usuarios[index] = {
      ...usuarios[index],
      nome: editUserForm.editUserName.value,
      email: editUserForm.editUserEmail.value,
      cargo: editUserForm.editUserCargo.value
    };
    renderizarUsuarios();
    editUserModal.style.display = 'none';
  }
});

// Redefinir senha para padrão (coordenador)
btnRedefinirSenhaPadrao.addEventListener('click', async () => {
  const id = editUserForm.editUserId.value;
  if (!confirm('Deseja redefinir a senha deste usuário para a padrão?')) return;

  try {
    const res = await fetch(`/api/usuarios/${id}/redefinir-senha`, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ novaSenha: "$2b$12$SafcGB.Y7vBzr1FB/KzVs.Ytm91/1IrUSQ0wp4..syc/fLZlb4dSS" })
    });
    const data = await res.json();
    if (res.ok) alert('Senha redefinida com sucesso!');
    else alert(data.error);
  } catch (err) { console.error(err); alert('Erro ao redefinir senha.'); }
});

// Abrir modal de novo usuário
btnNewUser.addEventListener('click', () => { newUserModal.style.display = 'block'; });
closeNewUserModal.addEventListener('click', () => { newUserModal.style.display = 'none'; });
window.addEventListener('click', e => { if(e.target === newUserModal) newUserModal.style.display = 'none'; });

// Criar novo usuário
newUserForm.addEventListener('submit', async e => {
  e.preventDefault();
  const novoUsuario = {
    login: newUserForm.newUserLogin.value,
    nome: newUserForm.newUserName.value,
    email: newUserForm.newUserEmail.value,
    cargo: newUserForm.newUserCargo.value
  };
  try {
    const response = await fetch('/api/usuarios', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
      body: JSON.stringify(novoUsuario)
    });
    if (!response.ok) { const errorData = await response.json(); alert('Erro ao criar usuário: ' + errorData.error); return; }
    const data = await response.json();
    alert('Usuário criado com sucesso! ID: ' + data.id);
    await carregarUsuarios();
    newUserModal.style.display = 'none';
    newUserForm.reset();
  } catch (err) { console.error(err); alert('Erro de conexão ao criar usuário.'); }
});

// Abrir modal redefinir própria senha
btnAbrirRedefinirSenha.addEventListener('click', () => {
  redefinirSenhaModal.style.display = 'block';
});

// Fechar modal redefinir senha
closeRedefinirSenha.addEventListener('click', () => {
  redefinirSenhaModal.style.display = 'none';
});
window.addEventListener('click', e => { if(e.target === redefinirSenhaModal) redefinirSenhaModal.style.display = 'none'; });

// Redefinir própria senha
btnRedefinirMinhaSenha.addEventListener('click', async () => {
  const novaSenha = inputNovaSenha.value;
  if (!novaSenha) { alert('Digite a nova senha.'); return; }
  if (!confirm('Deseja redefinir sua senha?')) return;

  try {
    const res = await fetch(`/api/usuarios/${usuarioLogado.id}/redefinir-senha`, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ novaSenha })
    });
    const data = await res.json();
    if (res.ok) { alert('Senha redefinida com sucesso!'); inputNovaSenha.value = ''; redefinirSenhaModal.style.display = 'none'; }
    else alert(data.error);
  } catch (err) { console.error(err); alert('Erro ao redefinir senha.'); }
});

window.addEventListener('DOMContentLoaded', carregarUsuarios);
</script>
</body>
</html>
