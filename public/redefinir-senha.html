<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redefinir Senha - Sistema</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background: radial-gradient(circle, #eed8c3 10%, #df662e);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .reset-container {
      background-color: #ffffff;
      border-radius: 1.5rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      max-width: 400px;
      width: 100%;
      padding: 2rem;
    }
    .reset-header {
      text-align: center;
      margin-bottom: 2rem;
      color: #e05414;
    }
    .reset-header h2 {
      font-size: 2rem;
      font-weight: bold;
    }
    .input-field {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid #cbd5e1;
      border-radius: 0.75rem;
      margin-bottom: 1rem;
      outline: none;
      transition: all 0.3s;
    }
    .input-field:focus {
      border-color: #e05414;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.3);
    }
    .btn-reset {
      width: 100%;
      padding: 0.75rem;
      background-color: #e05414;
      color: white;
      border-radius: 0.75rem;
      font-weight: 600;
      transition: background-color 0.3s;
    }
    .btn-reset:hover {
      background-color: #e05414;
    }
    .footer-text {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.875rem;
      color: #64748b;
    }
    .footer-text a {
      color: #e05414;
      font-weight: 500;
      text-decoration: none;
    }
    .footer-text a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="reset-container">
    <div class="reset-header">
      <h2>Redefinir Senha</h2>
      <p>Digite sua nova senha abaixo</p>
    </div>

    <form id="resetForm">
      <input type="password" id="newPassword" name="newPassword" required class="input-field" placeholder="Nova senha">
      <input type="password" id="confirmPassword" name="confirmPassword" required class="input-field" placeholder="Confirme a nova senha">
      <button type="submit" class="btn-reset">Redefinir Senha</button>
    </form>

    <p class="footer-text">
      Lembrou sua senha? <a href="login.html">Faça login</a>
    </p>
  </div>

  <script>
    // Pegar token da URL
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');

    const form = document.getElementById('resetForm');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const newPassword = form.newPassword.value;
      const confirmPassword = form.confirmPassword.value;

      if (newPassword !== confirmPassword) {
        alert('As senhas não coincidem');
        return;
      }

      try {
        const res = await fetch('/api/redefinir-senha', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, newPassword })
        });

        const data = await res.json();

        if (res.ok) {
          alert('Senha redefinida com sucesso!');
          window.location.href = 'login.html';
        } else {
          alert(data.error || 'Erro ao redefinir senha');
        }
      } catch (err) {
        console.error(err);
        alert('Erro ao redefinir senha');
      }
    });
  </script>

</body>
</html>
